<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160d29"><title>My BTS Shows 💜</title>
<style>
:root{color-scheme:dark;--bg:#10091c;--panel:#1c1230;--panel2:#281840;--purple:#b58aff;--pink:#f0c7ff;--text:#fff;--muted:#bdb0d0;}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#392052 0,#160d25 40%,#10091c 80%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:720px;margin:auto;padding:24px 16px 48px}header{padding:10px 2px 20px}.eyebrow{color:var(--pink);font-weight:700;letter-spacing:2px;font-size:12px}h1{font-size:30px;line-height:1.1;margin:8px 0}.sub{color:var(--muted);margin:0}.stats{background:linear-gradient(135deg,#3a2156,#211333);border:1px solid #61447e;border-radius:22px;padding:18px;margin:14px 0 18px}.statline{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}.bar{height:9px;background:#10091c;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#9b6cff,#f0c7ff);border-radius:99px;transition:width .2s}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;color:white;background:#251638;border:1px solid #59416f;border-radius:14px;padding:10px 13px}button.active{background:#b58aff;color:#1b1028;border-color:#b58aff;font-weight:800}select{width:100%;margin-bottom:16px}.yearhead{color:#d9baff;font-size:21px;margin:26px 2px 10px}.item{display:flex;gap:12px;align-items:flex-start;background:rgba(39,25,58,.92);border:1px solid #39264f;border-radius:17px;padding:14px;margin:9px 0}.item input{appearance:none;flex:0 0 23px;width:23px;height:23px;border:2px solid #9c7cc0;border-radius:7px;margin:2px 0 0;position:relative}.item input:checked{background:#b58aff;border-color:#b58aff}.item input:checked:after{content:"✓";position:absolute;color:#1b1028;font-weight:900;left:4px;top:-1px}.details{min-width:0;flex:1}.name{font-weight:750;font-size:16px;line-height:1.35}.meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}.item.done{opacity:.62}.item.done .name{text-decoration:line-through}.empty{color:var(--muted);text-align:center;padding:30px 12px}footer{color:#9d8bad;font-size:12px;line-height:1.5;margin-top:25px;text-align:center}
</style></head><body><main>
<header><div class="eyebrow">ARMY WATCHLIST</div><h1>My BTS Shows 💜</h1><p class="sub">Отмечай просмотренное и следи за прогрессом</p></header>
<section class="stats"><div class="statline"><span>Твой прогресс 💜</span><span id="count">0 из 37</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta" id="percent">Ты только начинаешь — 화이팅!</div></section>
<div class="filters"><button class="active" data-filter="all">Все шоу</button><button data-filter="todo">Не смотрела</button><button data-filter="done">Посмотрела</button></div>
<select id="year"><option value="all">Все годы</option></select><section id="list"></section>
<footer>Список составлен по твоим скриншотам. Даты и число выпусков у некоторых проектов могут требовать дополнительной проверки.</footer>
</main><script>
const shows=[{"year": "2013", "title": "Rookie King: Channel Bangtan", "episodes": "8 эпизодов", "dates": "3 сентября – 22 октября 2013"}, {"year": "2014", "title": "BTS China Job", "episodes": "3 эпизода", "dates": "18 мая – 1 июня 2014"}, {"year": "2014", "title": "BTS American Hustle Life", "episodes": "8 эпизодов", "dates": "24 июля – 11 сентября 2014"}, {"year": "2014", "title": "GO! BTS", "episodes": "1 выпуск", "dates": "4 сентября 2014"}, {"year": "2015", "title": "BTS Lucky Draw (Bokbulbok)", "episodes": "5 эпизодов", "dates": "27 мая – 8 июня 2015"}, {"year": "2015", "title": "Run BTS! — первый сезон", "episodes": "10 эпизодов", "dates": "1 августа 2015 – 5 января 2016"}, {"year": "2015", "title": "BTS GAYO, сезон 1", "episodes": "9 эпизодов", "dates": "11 августа – 12 декабря 2015"}, {"year": "2016", "title": "BTS Bon Voyage, сезон 1", "episodes": "8 эпизодов", "dates": "5 июля – 23 августа 2016"}, {"year": "2017", "title": "BTS GAYO, сезон 2", "episodes": "6 эпизодов", "dates": "24 января – 16 мая 2017"}, {"year": "2017", "title": "Run BTS!, сезон 2", "episodes": "46 эпизодов", "dates": "31 января 2017 – 24 июля 2018"}, {"year": "2017", "title": "BTS Bon Voyage, сезон 2", "episodes": "8 эпизодов", "dates": "27 июня – 15 августа 2017"}, {"year": "2017", "title": "Comeback Show — BTS DNA", "episodes": "1 выпуск", "dates": "21 сентября 2017"}, {"year": "2017", "title": "BTS Countdown", "episodes": "1 выпуск", "dates": "12 октября 2017"}, {"year": "2018", "title": "Burn the Stage", "episodes": "8 эпизодов", "dates": "28 марта – 10 мая 2018"}, {"year": "2018", "title": "BTS Comeback Show: Highlight Reel", "episodes": "1 выпуск", "dates": "24 мая 2018"}, {"year": "2018", "title": "BTS Bon Voyage, сезон 3", "episodes": "8 эпизодов", "dates": "18 сентября – 6 ноября 2018"}, {"year": "2019", "title": "Run BTS! — продолжение основного шоу", "episodes": "выпуски 2019 года", "dates": "2019"}, {"year": "2019", "title": "Bring the Soul: Docu-Series", "episodes": "6 эпизодов", "dates": "27 августа – 1 октября 2019"}, {"year": "2019", "title": "BTS Bon Voyage, сезон 4", "episodes": "8 эпизодов", "dates": "19 ноября 2019 – 7 января 2020"}, {"year": "2020", "title": "Learn Korean with BTS", "episodes": "30 уроков", "dates": "с 24 марта 2020"}, {"year": "2020", "title": "Break the Silence: Docu-Series", "episodes": "7 эпизодов", "dates": "12 мая – 9 июня 2020"}, {"year": "2020", "title": "In the SOOP BTS ver., сезон 1", "episodes": "8 эпизодов", "dates": "19 августа – 7 октября 2020"}, {"year": "2020", "title": "MapleStory × BTS", "episodes": "серия совместных выпусков", "dates": "2020"}, {"year": "2021", "title": "Run BTS! — продолжение основного шоу", "episodes": "выпуски 2021 года", "dates": "2021"}, {"year": "2021", "title": "The Game Caterers × Run BTS!", "episodes": "2 эпизода", "dates": "7 и 14 мая 2021"}, {"year": "2021", "title": "In the SOOP BTS ver., сезон 2", "episodes": "5 выпусков на Weverse", "dates": "15 октября – 12 ноября 2021"}, {"year": "2021", "title": "Let’s BTS", "episodes": "1 специальный выпуск", "dates": "29 марта 2021"}, {"year": "2022", "title": "Run BTS! Specials", "episodes": "10 эпизодов", "dates": "16 августа 2022 – 21 февраля 2023"}, {"year": "2022", "title": "BTS MBTI Lab", "episodes": "2 эпизода", "dates": "2022"}, {"year": "2022", "title": "BTS Become Game Developers", "episodes": "4 эпизода", "dates": "26 апреля – 17 мая 2022"}, {"year": "2022", "title": "The Tales of Bangtan Kingdom", "episodes": "специальный проект", "dates": "2022"}, {"year": "2022", "title": "Free Fire × BTS Show Series", "episodes": "6 основных эпизодов и 2 специальных выпуска", "dates": "март – апрель 2022"}, {"year": "2023", "title": "Run BTS! Specials — завершение специальных выпусков", "episodes": "специальные выпуски", "dates": "21 февраля 2023"}, {"year": "2023", "title": "BTS Monuments: Beyond the Star", "episodes": "8 эпизодов", "dates": "20 декабря 2023 – 10 января 2024"}, {"year": "2024", "title": "BTS Monuments: Beyond the Star — последние эпизоды", "episodes": "3 и 10 января 2024", "dates": "2024"}, {"year": "2025", "title": "BTS FESTA", "episodes": "ежегодные праздничные материалы", "dates": "2025"}, {"year": "2026", "title": "Run BTS! 2.0", "episodes": "3 эпизода", "dates": "23 апреля – 5 мая 2026"}];
const key="my-bts-shows-v2";
let watched={};try{watched=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){watched={}}
let filter="all",year="all";
const yearSelect=document.getElementById("year");
[...new Set(shows.map(s=>s.year))].forEach(y=>{let o=document.createElement("option");o.value=y;o.textContent=y;yearSelect.appendChild(o)});
function render(){
 const list=document.getElementById("list");list.innerHTML="";
 let shown=shows.filter((s,i)=>(year==="all"||s.year===year)&&(filter==="all"||(filter==="done"&&watched[i])||(filter==="todo"&&!watched[i])));
 let last="";
 shown.forEach(s=>{let i=shows.indexOf(s);if(s.year!==last){let h=document.createElement("h2");h.className="yearhead";h.textContent=s.year;list.appendChild(h);last=s.year}
 let label=document.createElement("label");label.className="item"+(watched[i]?" done":"");
 let cb=document.createElement("input");cb.type="checkbox";cb.checked=!!watched[i];cb.setAttribute("aria-label","Отметить просмотренным");
 cb.addEventListener("change",()=>{watched[i]=cb.checked;localStorage.setItem(key,JSON.stringify(watched));render()});
 let d=document.createElement("div");d.className="details";
 let n=document.createElement("div");n.className="name";n.textContent=s.title;
 let m=document.createElement("div");m.className="meta";m.textContent=s.episodes+" · "+s.dates;
 d.append(n,m);label.append(cb,d);list.appendChild(label);
 });
 if(!shown.length){let e=document.createElement("div");e.className="empty";e.textContent="Здесь пока ничего нет 💜";list.appendChild(e)}
 let n=Object.values(watched).filter(Boolean).length;document.getElementById("count").textContent=n+" из "+shows.length;
 let pct=Math.round(n/shows.length*100);document.getElementById("fill").style.width=pct+"%";document.getElementById("percent").textContent=pct+"% просмотрено";
}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));
yearSelect.addEventListener("change",()=>{year=yearSelect.value;render()});render();
</script></body></html>
